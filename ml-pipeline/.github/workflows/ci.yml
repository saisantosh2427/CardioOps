name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  MLFLOW_DISABLE_TELEMETRY: "true"
  GIT_PYTHON_REFRESH: quiet

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.17.0
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (unit + API + training smoke + drift/retrain logic)
        run: pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml --junitxml=junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            coverage.xml
            junit.xml

  docker:
    name: Docker (${{ matrix.image }})
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: api/Dockerfile
          - image: monitor
            dockerfile: monitor/Dockerfile
          - image: pipeline
            dockerfile: docker/pipeline/Dockerfile
    env:
      # Push only from main; PRs and other branches just build + smoke test.
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build (and load locally for the smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Smoke test API image (starts and answers /health without MLflow)
        if: matrix.image == 'api'
        run: |
          tag=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name api-smoke -p 8000:8000 "$tag"
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then echo; docker rm -f api-smoke; exit 0; fi
            sleep 2
          done
          docker logs api-smoke; exit 1
      - name: Smoke test monitor image (imports the app)
        if: matrix.image == 'monitor'
        run: |
          tag=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run --rm "$tag" python -c "import monitor.app; print('ok')"
      - name: Smoke test pipeline image (imports every module)
        if: matrix.image == 'pipeline'
        run: |
          tag=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run --rm "$tag" python -c "import src.ingest, src.train, src.drift, src.retrain, scripts.simulate_drift; print('ok')"
      - name: Push to GitHub Container Registry
        if: env.PUSH == 'true'
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do docker push "$tag"; done
