name: Scheduled retraining

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Retrain even if no drift / performance drop is detected"
        type: boolean
        default: false
      drift_intensity:
        description: "Intensity of the simulated drift (0 = no drift)"
        type: string
        default: "1.0"

permissions:
  contents: read

concurrency:
  group: retrain
  cancel-in-progress: false

# IMPORTANT: a GitHub-hosted runner cannot reach the MLflow server, MinIO or
# Postgres running in your local docker-compose stack. This workflow therefore
# uses a *file-based* MLflow store inside the runner (a SQLite file for
# tracking + registry and a local ./mlruns artifact directory), persisted
# between runs with actions/cache so the champion survives from week to week.
# To retrain against a real MLflow server instead, run this job on a
# self-hosted runner that can reach it and set PIPELINE_MLFLOW__TRACKING_URI.
env:
  PIPELINE_MLFLOW__TRACKING_URI: sqlite:///mlops-store/mlflow.db
  PIPELINE_PROJECT__LOG_FORMAT: json
  MLFLOW_DISABLE_TELEMETRY: "true"
  GIT_PYTHON_REFRESH: quiet

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Restore the file-based MLflow store from previous runs
        uses: actions/cache/restore@v6
        with:
          path: |
            mlops-store
            mlruns
          key: mlflow-store-${{ github.run_id }}
          restore-keys: mlflow-store-

      - name: Ingest data
        run: |
          mkdir -p mlops-store
          python -m src.ingest

      - name: Bootstrap a champion (first run only)
        run: python -m src.train --skip-if-champion

      # In a real deployment the current window would be an export of the
      # production prediction log; here we simulate a new hospital site.
      - name: Simulate drifted production data
        run: python -m scripts.simulate_drift --intensity "${{ inputs.drift_intensity || '1.0' }}"

      - name: Drift check + retrain + promotion gate
        run: |
          python -m src.retrain --source file \
            --current-path data/production/drifted_batch.parquet \
            ${{ inputs.force && '--force' || '' }}

      - name: Job summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          path = pathlib.Path("reports/retrain_summary.json")
          if not path.exists():
              print("No retrain summary produced."); raise SystemExit
          s = json.loads(path.read_text())
          print("## Retraining run")
          print(f"- **Action:** `{s['action']}`")
          print(f"- **Champion:** v{s['champion_version_before']} -> v{s['champion_version_after']}")
          print(f"- **Drift share:** {s['drift']['drift_share']} "
                f"(drifted: {', '.join(s['drift']['drifted_columns']) or 'none'})")
          for reason in s["decision"]["reasons"]:
              print(f"- {reason}")
          if s.get("comparison"):
              c = s["comparison"]
              print(f"- **{c['metric']}**: challenger {c['challenger_value']:.4f} vs "
                    f"champion {c['champion_value']:.4f} -> {c['reason']}")
          EOF

      - name: Upload reports and metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retrain-reports-${{ github.run_id }}
          path: |
            reports/
            data/raw/manifest.json
          retention-days: 30

      - name: Persist the MLflow store for the next run
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            mlops-store
            mlruns
          key: mlflow-store-${{ github.run_id }}
