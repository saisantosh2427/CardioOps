[project]
name = "heart-disease-mlops"
version = "1.0.0"
description = "End-to-end MLOps pipeline for heart disease risk prediction (100% free/open-source stack)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
# Vercel resolves pyproject.toml before requirements.txt. Keep these pins aligned
# with the existing Docker/CLI requirements (verified by tests/test_config.py).
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
    "pyarrow==25.0.1",
    "matplotlib==3.11.2",
    "pandera==0.34.1",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "mlflow==3.17.0",
    "skops==0.16.0",
    "evidently==0.7.23",
    "prometheus-client==0.26.0",
    "sqlalchemy==2.1.4",
    "psycopg[binary]==3.3.6",
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "requests==2.34.2",
    "structlog==26.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "mlruns", "mlartifacts", "reports"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "SIM", # simplify
  "RUF", # ruff-specific
]
ignore = [
  "N803", # X / X_train argument names are the ML convention
  "N806", # same for local variables
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: trains real models / runs Evidently (deselect with -m 'not slow')"]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
  "ignore::UserWarning",
]

[tool.coverage.run]
source = ["src", "api", "monitor", "scripts"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
